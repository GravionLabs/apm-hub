name: copilot-workspace
version: 1.0.39
description: Setup and sync GitHub Copilot configuration from GravionLabs/copilot-hub.
  Provides an interactive wizard (gh-copilot-setup) to bootstrap .github/ with instructions,
  prompts, and agents tailored to your stack, plus a sync prompt (gh-copilot-sync)
  to keep them up to date. Includes gh-agents-md to scaffold an AGENTS.md repository
  context file. Issue workflow skills (gh-issue-implement, gh-issue-finish, gh-issue-work)
  automate the full branch → implement → review → PR lifecycle. The standalone scripts
  (copilot-sync.ps1, New-AgentsMd.ps1) are included for manual or scheduled runs without
  the AI prompt.
author:
  name: Gravion
license: MIT
status: production
keywords:
- copilot
- github-copilot
- setup
- sync
- workspace
- configuration
- agents-md
- issue-workflow
primitives:
  skills:
  - source: copilot/skills/gh-copilot-setup
    name: gh-copilot-setup
  - source: copilot/skills/gh-copilot-sync
    name: gh-copilot-sync
  - source: copilot/skills/gh-agents-md
    name: gh-agents-md
  - source: copilot/skills/gh-issue-implement
    name: gh-issue-implement
  - source: copilot/skills/gh-issue-finish
    name: gh-issue-finish
  - source: copilot/skills/gh-issue-work
    name: gh-issue-work
