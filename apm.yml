name: apm-hub
version: 1.0.0
description: >
  Meta-package — installs all apm-hub packages for repository contributors.
  Use individual packages (e.g. gravion/apm-hub/packages/angular) in your projects.
author:
  name: Gravion
license: MIT
includes: auto
dependencies:
  apm:
    - ./packages/ag-grid
    - ./packages/angular
    - ./packages/common
    - ./packages/copilot-workspace
    - ./packages/csharp
    - ./packages/devops
    - ./packages/docker
    - ./packages/go
    - ./packages/helm
    - ./packages/playwright
    - ./packages/postgresql
    - ./packages/python
    - ./packages/security
    - ./packages/shared
    - ./packages/terraform
    - ./packages/typescript
  mcp: []
