name: apm-hub
version: 1.0.0
description: 'Marketplace for GravionLabs APM packages.'
author:
  name: Gravion
license: MIT

marketplace:
  owner:
    name: Gravion
    url: https://github.com/GravionLabs
  packages:
  - name: shared
    description: Cross-cutting skills for AI development agents. Includes language-agnostic implementation rules, test triads, and pre-commit checks.
    source: ./packages/shared
  - name: github
    description: GitHub workflow agents and skills for issue management, pull request creation, and repository automation.
    source: ./packages/github
  - name: development-workflow
    description: Development workflow orchestration. Provides tool-agnostic and OpenCode-specific agents for plan → implement → verify pipeline.
    source: ./packages/development-workflow
  - name: angular
    description: Angular full-stack development plugin.
    source: ./packages/angular
  - name: dotnet
    description: C#/.NET full-stack development plugin.
    source: ./packages/dotnet
  - name: python
    description: Python development plugin.
    source: ./packages/python
  - name: typescript
    description: TypeScript and Node.js development plugin.
    source: ./packages/typescript
