name: apm-hub
version: 1.0.19
description: 'Marketplace for GravionLabs apm-hub packages. Use individual packages
  (e.g. gravion/apm-hub/packages/angular) in your projects.

  '
author:
  name: Gravion
license: MIT

marketplace:
  owner:
    name: Gravion
    url: https://github.com/GravionLabs
  packages:
  - name: all
    description: "Meta-package that installs all GravionLabs apm-hub packages in one go. Suitable for workspaces that use multiple tech stacks and want the full skill set available."
    source: ./packages/all
  - name: apm-tooling
    description: "APM contributor tooling — agent and skill lifecycle management. Provides skills for auditing, creating, updating, and writing APM agents and skills."
    source: ./packages/apm-tooling
  - name: development-workflow
    description: "GitHub development workflow orchestration: issue-driven implementation, tech-stack detection, multi-repo support, and PR review."
    source: ./packages/development-workflow
  - name: dotnet
    description: "C#/.NET development plugin. Covers solution scaffolding with Central Package Management, NUnit/NSubstitute/Shouldly testing, implementation conventions (async, logging, EF Core), MCP server generation, and .NET upgrades."
    source: ./packages/dotnet
  - name: github
    description: "GitHub workflow skills for issue management, pull requests, and repository automation. Provides skills for the full GitHub development lifecycle."
    source: ./packages/github
  - name: ng
    description: "Angular 21 full-stack development plugin. Covers standalone components, NgRx Signal Store, Angular libraries, PrimeNG, ESLint/Prettier setup, sakai-ui conventions, AG Grid integration, and testing with Vitest."
    source: ./packages/ng
  - name: py
    description: "Python development plugin. Covers project setup with uv, pytest testing with fixtures and markers, implementation conventions, and a curated uv CLI reference."
    source: ./packages/py
  - name: shared
    description: "Shared skills used across all GravionLabs apm-hub packages: tech-stack detection (detect-techstack), language-agnostic implementation rules (implementation), code review (code-review), and code-quality pipeline setup (setup-prettier-eslint-husky)."
    source: ./packages/shared
  - name: ts
    description: "TypeScript and Node.js development plugin. Covers project scaffolding with strict tsconfig and ESM, Vitest testing, implementation conventions, MCP server generation, and pnpm migration."
    source: ./packages/ts
