site_name: copilot-hub
site_description: A curated hub for sharing GitHub Copilot instructions, agents, prompts, and CLI plugins.
site_url: https://gravionlabs.github.io/copilot-hub/
repo_url: https://github.com/GravionLabs/copilot-hub
repo_name: GravionLabs/copilot-hub

docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Home: overview.md
  - Usage:
      - Common Workflows: usage/common-workflows.md
      - How to Use Instructions: usage/how-to-use-instructions.md
      - How to Use Prompts: usage/how-to-use-prompts.md
      - How to Use Agents: usage/how-to-use-agents.md
  - Concepts:
      - Mental Model: concepts/mental-model.md
      - Instructions: concepts/instructions.md
      - Prompts: concepts/prompts.md
      - Agents: concepts/agents.md
      - Plugins: concepts/plugins.md
      - Skills: concepts/skills.md
  - Best Practices:
      - Writing Good Instructions: best-practices/writing-good-instructions.md
      - Writing Effective Prompts: best-practices/writing-effective-prompts.md
      - Designing Agents: best-practices/designing-agents.md
      - Do's and Don'ts: best-practices/do-and-dont.md
  - Checklists:
      - Instructions Review: checklists/instructions-review-checklist.md
      - Prompt Review: checklists/prompt-review-checklist.md
  - Sync:
      - Copilot Workspace: sync/copilot-workspace.md
      - Wiki Sync: sync/wiki-sync.md
  - Reference:
      - Template List: template-list.md
      - Plugin List: plugin-list.md
      - Skill List: skill-list.md
      - JetBrains AI: jetbrains-ai.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - attr_list
