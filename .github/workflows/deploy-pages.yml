name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**'
      - 'mkdocs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-pages:
    uses: GravionLabs/ci/.github/workflows/deploy-pages.yml@main
