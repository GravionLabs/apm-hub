name: Generate Documentation

on:
  push:
    branches:
      - main
    paths:
      - '.github/agents/**'
      - '.github/prompts/**'
      - '.github/instructions/**'
      - '.github/copilot-instructions.md'
      - 'scripts/generate-template-list.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Template List
        run: python3 scripts/generate-template-list.py

      - name: Check for changes
        id: git-check
        run: |
          git diff --quiet docs/template-list.md || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and Push
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/template-list.md
          git commit -m "docs: update template list [skip ci]"
          git push
