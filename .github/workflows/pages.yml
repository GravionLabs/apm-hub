name: Pages

# The documentation site (site/, VitePress) on GitHub Pages. Pull requests that touch the site or its
# documents build it, so a dead link is found before the merge; only main deploys, and only while the
# repository variable DEPLOY_PAGES is "true" (Settings -> Pages -> Source must be "GitHub Actions").
#
# The generated lists (docs/*-list.md) are regenerated inside the build job instead of reacting to CI
# with `workflow_run`: the `regenerate-and-commit` job in ci.yml pushes with `github.token` (+ `[skip ci]`),
# and such a push triggers no workflow, so a Pages run could be one commit stale or missing. Building the
# lists here guarantees they are current. This job never commits, so `lint-no-generated-files` is unaffected.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deployments queue up behind each other and the last one wins; a pull request replaces its own earlier run.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the site
    if: github.event_name == 'pull_request' || vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: GravionLabs/ci/node/setup@cbb01f83374efa76491226e97bcf1d5cf9674fab # main
        with:
          node-version: '24'
          package-manager: pnpm
      - run: pnpm install --frozen-lockfile
      # tsc build, then the generated lists (they need dist first).
      - name: Generate the lists
        run: pnpm run generate:all
      # Dead links fail this step.
      - name: Build the site
        run: SITE_BASE=/${{ github.event.repository.name }}/ pnpm --filter site build
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
