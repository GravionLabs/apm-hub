name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest
    # NOTE: The GitHub Wiki must be enabled first:
    #   Repository Settings → General → Features → Wikis ✓
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git" wiki
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy docs to wiki
        run: |
          # README.md → Home.md (wiki landing page)
          cp README.md wiki/Home.md

          # Mirror docs/**/*.md preserving sub-directory names as flat wiki pages
          # Wiki does not support subdirectories — use path-based names:
          #   docs/overview.md           → Overview.md
          #   docs/concepts/plugins.md   → Concepts-Plugins.md
          #   docs/sync/shared-config-sync.md → Sync-Shared-Config-Sync.md
          find docs -name '*.md' | while IFS= read -r file; do
            # Strip leading "docs/" and convert path separators to dashes
            rel="${file#docs/}"
            wiki_name=$(echo "$rel" | sed 's|/|-|g; s|-\([a-z]\)|\u\1|g; s|^\([a-z]\)|\u\1|g')
            # Use title-case conversion via simple capitalize
            wiki_name=$(echo "$rel" | awk -F'/' '{
              for(i=1;i<=NF;i++) {
                w=$i
                sub(/\.md$/, "", w)
                # capitalize each segment
                printf "%s%s", toupper(substr(w,1,1)), substr(w,2)
                if(i<NF) printf "-"
              }
              print ".md"
            }')
            cp "$file" "wiki/${wiki_name}"
          done

      - name: Commit and push wiki changes
        run: |
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit."
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push
          fi
