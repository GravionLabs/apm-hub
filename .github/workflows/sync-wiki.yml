name: Sync Wiki

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'docs/**/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    name: Sync docs to GitHub Wiki
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone or initialize wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WIKI_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.wiki.git"

          # Check if wiki feature is enabled
          HAS_WIKI=$(gh api "repos/${{ github.repository }}" --jq '.has_wiki' 2>/dev/null || echo "false")
          if [ "$HAS_WIKI" != "true" ]; then
            echo "::warning::Wiki is disabled. Enable it in Settings → General → Features → Wikis."
            echo "WIKI_SKIP=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if git clone "$WIKI_URL" wiki; then
            echo "Cloned existing wiki."
          else
            # Wiki is enabled but not yet initialized — push an initial page
            echo "Initializing wiki (first time setup)..."
            mkdir wiki
            cd wiki
            git init -b master
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            echo "# copilot-hub Wiki" > Home.md
            echo "" >> Home.md
            echo "This wiki is automatically synced from the [copilot-hub repository](https://github.com/${{ github.repository }})." >> Home.md
            git add Home.md
            git commit -m "Initialize wiki"
            git remote add origin "$WIKI_URL"
            git push -u origin master
            cd ..
          fi

          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..

      - name: Copy docs to wiki
        if: env.WIKI_SKIP != 'true'
        run: |
          # README.md → Home.md (wiki landing page)
          cp README.md wiki/Home.md

          # Mirror docs/**/*.md as flat wiki pages with path-based names:
          #   docs/overview.md                 → Overview.md
          #   docs/concepts/plugins.md         → Concepts-Plugins.md
          #   docs/sync/shared-config-sync.md  → Sync-Shared-Config-Sync.md
          find docs -name '*.md' | sort | while IFS= read -r file; do
            rel="${file#docs/}"
            wiki_name=$(echo "$rel" | awk -F'/' '{
              for (i = 1; i <= NF; i++) {
                w = $i
                sub(/\.md$/, "", w)
                printf "%s%s", toupper(substr(w, 1, 1)) substr(w, 2), (i < NF ? "-" : ".md")
              }
              print ""
            }')
            cp "$file" "wiki/${wiki_name}"
          done

      - name: Commit and push wiki changes
        if: env.WIKI_SKIP != 'true'
        run: |
          cd wiki
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes to commit."
          else
            git commit -m "docs: sync wiki from main [skip ci]"
            git push
          fi
