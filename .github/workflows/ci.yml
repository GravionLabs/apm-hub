name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: GravionLabs/ci/.github/workflows/node-ci.yml@main
    permissions:
      checks: write
      pull-requests: write
      contents: read
    with:
      node-version: '24'

  update-docs:
    name: Update Docs
    runs-on: ubuntu-latest
    needs:
      - ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regenerate documentation
        run: npm run generate -- --version ${{ steps.version.outputs.semver }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ plugins/**/.github/plugin/plugin.json plugins/*/plugin.config.yml README.md
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate docs and manifests [skip ci]"
          git push

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - ci
      - update-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ steps.version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'
