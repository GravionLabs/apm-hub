name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, release/next]
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  lint-no-generated-files:
    name: No Generated Files in PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for auto-generated aggregate files
        run: |
          GENERATED_FILES=(
            "docs/skill-list.md"
            "docs/template-list.md"
            "docs/instruction-list.md"
          )

          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          VIOLATIONS=""

          for file in "${GENERATED_FILES[@]}"; do
            if echo "$CHANGED" | grep -qF "$file"; then
              VIOLATIONS="$VIOLATIONS\n  - $file"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ This PR modifies auto-generated files that must not be committed in feature branches:"
            printf "$VIOLATIONS\n"
            echo ""
            echo "These files are regenerated automatically by CI after merging to main."
            echo "Please remove them from your commits. See CONTRIBUTING.md for details."

            {
              echo "## ❌ Auto-generated files found in PR"
              echo ""
              echo "This PR modifies files that are **only allowed to change via CI after merging to \`main\`**."
              echo "Please remove these files from your commits."
              echo ""
              echo "### Violations"
              echo ""
              printf "$VIOLATIONS\n" | sed 's/^[[:space:]]*//' | while IFS= read -r line; do
                echo "- \`$line\`"
              done
              echo ""
              echo "### How to fix"
              echo ""
              echo '```bash'
              printf "$VIOLATIONS\n" | sed 's/^[[:space:]]*//' | while IFS= read -r line; do
                echo "git checkout origin/${{ github.base_ref }} -- $line"
              done
              echo '```'
              echo ""
              echo "> **Tip:** Use \`npm run generate\` (not \`generate:ci\`) locally — it never touches the aggregate docs."
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "✅ No auto-generated aggregate files found in PR."

          {
            echo "## ✅ No auto-generated aggregate files in PR"
            echo ""
            echo "The following files were checked and are **not modified** in this PR:"
            echo ""
            for file in "${GENERATED_FILES[@]}"; do
              echo "- \`$file\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    # Local equivalent: pnpm run check; keep CI checks separate for individual job logs.
    permissions:
      checks: write
      pull-requests: write
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm

      - name: Build
        uses: GravionLabs/ci/node/build@main
        with:
          node-version: '24'
          package-manager: pnpm
          package-manager-version: '11.6.0'
          build-command: pnpm run build

      - name: Check manifest skills lists
        run: node scripts/check-manifests.mjs

      - name: Skill report (sizes, dangling references)
        shell: pwsh
        run: ./packages/apm-tooling/.apm/skills/skill-slim/scripts/Get-SkillReport.ps1 -Root . -FailOnDangling

      - name: Check formatting
        run: pnpm run format:check

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -RequiredVersion 1.24.0 -Scope CurrentUser -Force

      - name: Analyze PowerShell scripts
        run: pnpm run lint:ps

      # Generated aggregate docs are gitignored/CI-owned; generate them in the
      # working tree only so the site build resolves its links. Never committed here.
      # generate:all = tsc build + generate:ci; dist/ is not available after the test action.
      - name: Generate docs for site build
        run: pnpm run generate:all

      - name: Test docs site
        run: pnpm --filter site test

      - name: Build docs site
        run: pnpm --filter site build

      - name: Install APM
        uses: microsoft/apm-action@v1

      - name: Audit APM packages
        run: apm audit --ci

  # One Vitest project, one job. GravionLabs/ci/node/test@main is not used: its artifact and check names are fixed.
  test:
    name: Test
    runs-on: ubuntu-latest
    # Least privilege: the mutable node/build@main ref gets no pull-requests write.
    permissions:
      checks: write
      contents: read
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm

      - name: Build
        uses: GravionLabs/ci/node/build@main
        with:
          node-version: '24'
          package-manager: pnpm
          package-manager-version: '11.6.0'
          build-command: pnpm run build

      - name: Test
        run: pnpm run test:ci

      - name: Upload test results
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload coverage
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Publish test results
        if: success() || failure()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: test-results/junit.xml
          reporter: jest-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Coverage summary
        if: (success() || failure()) && hashFiles('coverage/cobertura-coverage.xml') != ''
        continue-on-error: true
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          format: markdown
          output: both

      - name: Add coverage to job summary
        if: success() || failure()
        shell: bash
        run: '[ -f code-coverage-results.md ] && cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY" || true'

  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  regenerate-and-commit:
    name: Regenerate & Commit
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - build-test
      - test
    permissions:
      contents: write
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Install pnpm
        shell: bash
        run: npm install -g pnpm

      - name: Build
        uses: GravionLabs/ci/node/build@main
        with:
          node-version: '24'
          package-manager: pnpm
          package-manager-version: '11.6.0'
          build-command: pnpm run build

      - name: Regenerate packages & documentation
        run: pnpm run generate:ci -- --version ${{ needs.determine-version.outputs.semver }}

      - name: Install APM CLI
        env:
          # Authenticated GitHub API calls avoid the anonymous shared-IP rate limit (HTTP 403)
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: curl -sSL https://aka.ms/apm-unix | sh

      - name: Pack marketplace
        run: apm pack

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/overview.md
          # Force-add gitignored aggregate docs
          git add -f docs/instruction-list.md docs/skill-list.md docs/template-list.md
          # Commit APM packages output (packages/ is gitignored for apm_modules/ and .github/ only)
          git add packages/*/apm.yml packages/all/ packages/core/
          # Add .apm directories (use find to handle glob expansion reliably)
          find packages -maxdepth 2 -name '.apm' -type d -exec git add {} + 2>/dev/null || true
          # Commit marketplace definition
          git add apm.yml .claude-plugin/marketplace.json
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate APM packages and docs [skip ci]"
          git push

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - build-test
      - test
      - regenerate-and-commit
    permissions:
      contents: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || github.token }}

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          version: ${{ needs.determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'
