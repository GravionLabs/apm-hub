name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  checks: write
  pull-requests: write
  contents: read

jobs:
  lint-no-generated-files:
    name: No Generated Files in PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for auto-generated aggregate files
        run: |
          GENERATED_FILES=(
            ".github/plugin/marketplace.json"
            "docs/plugin-list.md"
            "docs/skill-list.md"
            "docs/template-list.md"
          )

          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          VIOLATIONS=""

          for file in "${GENERATED_FILES[@]}"; do
            if echo "$CHANGED" | grep -qF "$file"; then
              VIOLATIONS="$VIOLATIONS\n  - $file"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ This PR modifies auto-generated files that must not be committed in feature branches:"
            printf "$VIOLATIONS\n"
            echo ""
            echo "These files are regenerated automatically by CI after merging to main."
            echo "Please remove them from your commits. See CONTRIBUTING.md for details."
            exit 1
          fi

          echo "✅ No auto-generated aggregate files found in PR."

  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        uses: GravionLabs/ci/node/build@main
        with:
          node-version: '24'

      - name: Test
        uses: GravionLabs/ci/node/test@main
        with:
          node-version: '24'

  determine-version:
    name: Determine Version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        uses: GravionLabs/ci/versioning/determine-version@main
        with:
          gitversion-config-file: GitVersion.yml

  update-docs:
    name: Update Docs
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - build-test
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        uses: GravionLabs/ci/node/build@main
        with:
          node-version: '24'

      - name: Render Mermaid diagrams
        run: npm run generate:diagrams

      - name: Regenerate plugins & documentation
        run: npm run generate -- --version ${{ needs.determine-version.outputs.semver }}

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ plugins/**/.github/plugin/plugin.json plugins/*/plugin.config.yml README.md
          if git diff --staged --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "chore: regenerate docs and manifests [skip ci]"
          git push

  release:
    name: Release
    runs-on: ubuntu-latest
    needs:
      - determine-version
      - build-test
      - update-docs
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: GravionLabs/ci/versioning/gh-release@main
        with:
          version: ${{ needs.determine-version.outputs.semver }}
          changelog-file: CHANGELOG.md
          cliff-config: cliff.toml
          update-changelog: 'true'
