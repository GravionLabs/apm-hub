name: postgresql
description: >-
  PostgreSQL development and administration plugin.
  Schema design, query optimization, performance diagnostics, code review,
  Row Level Security, JSONB, and SQL best practices.
version: "1.0.38"
author:
  name: Gravion
license: MIT
keywords:
  - postgresql
  - postgres
  - sql
  - database
  - performance

agents:
  - source: postgresql/agents/postgresql-dba
  - source: postgresql/agents/postgresql-developer

skills:
  # Code quality review
  - name: postgresql-code-review
    source: postgresql/skills/postgresql-code-review
  # Query and index optimization
  - name: postgresql-optimization
    source: postgresql/skills/postgresql-optimization
  # Cross-DB SQL optimization
  - name: sql-optimization
    source: postgresql/skills/sql-optimization
  # Performance diagnostics
  - name: postgresql-debug
    source: postgresql/skills/postgresql-debug

instructions:
  - source: postgresql/instructions/postgresql
