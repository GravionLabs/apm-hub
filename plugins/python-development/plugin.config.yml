name: python-development
description: >-
  Python development plugin.
  Covers project setup with uv, pytest testing with fixtures and markers,
  type hints, code review, Playwright Python testing, and containerization.
version: "1.0.38"
author:
  name: Gravion
license: MIT
keywords:
  - python
  - pytest
  - uv
  - playwright
  - typing
  - mcp
  - debugging

# Agents copied as-is from templates/agents/
agents:
  - source: python/agents/python-expert
  - source: python/agents/pytest-engineer
  - source: python/agents/python-mcp-expert
  - source: python/agents/python-reviewer
  - source: shared/agents/documentation-writer

# Skills generated from prompt templates
skills:
  # GitHub Actions CI/CD workflow for Python packages
  - name: create-python-workflow
    source: devops/skills/create-python-workflow
  # Structured Python code review (correctness, types, security, pytest)
  - name: python-code-review
    source: python/skills/python-code-review
  # pytest coverage reporting and configuration
  - name: pytest-coverage
    source: python/skills/pytest-coverage
  # Generate focused unit tests for existing code
  - name: write-tests
    source: shared/skills/write-tests
  # Diagnose and fix Python runtime errors, memory leaks, and performance issues
  - name: python-debug
    source: python/skills/python-debug
  # Set up or modernize Python packaging with pyproject.toml and uv
  - name: python-packaging
    source: python/skills/python-packaging
  # Scaffold a new Python 3.14 project with uv, ruff, and pytest
  - name: create-python-project
    source: python/skills/create-python-project

instructions:
  - source: python/instructions/python
  - source: python/instructions/python-pytest
  - source: python/instructions/playwright-python
