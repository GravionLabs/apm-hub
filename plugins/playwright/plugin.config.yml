name: playwright
description: >-
  Cross-language Playwright testing plugin.
  Browser automation, form filling, test generation, and website exploration.
  Language-specific instructions (playwright-dotnet, playwright-python, playwright-typescript)
  are bundled with the respective language plugins (csharp-development, python-development, typescript-node-development).
version: "1.0.32"
author:
  name: Gravion
license: MIT
keywords:
  - playwright
  - testing
  - browser-automation
  - e2e

agents:
  - source: playwright/agents/playwright-tester

skills:
  - name: playwright-generate-test
    source: playwright/skills/playwright-generate-test
  - name: playwright-explore-website
    source: playwright/skills/playwright-explore-website
  - name: playwright-automation-fill-in-form
    source: playwright/skills/playwright-automation-fill-in-form
  - name: playwright-debug
    source: playwright/skills/playwright-debug

instructions:
  - source: playwright/instructions/playwright
