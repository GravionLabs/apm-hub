name: gfog-security
description: >-
  Security and resilience tooling for GFOG squad.
  STRIDE threat modeling, RWEST SSDLC compliance review, and Disaster Recovery planning.
  Tech-stack agnostic – usable alongside any GFOG language plugin.
version: "1.0.0"
author:
  name: GFOG
license: MIT
keywords:
  - security
  - threat-model
  - stride
  - ssdlc
  - rwest
  - disaster-recovery
  - resilience
  - gfog

# Agents copied as-is from templates/agents/
agents:
  - source: threat-model-cli
  - source: rwest-ssdlc-reviewer
  - source: recovery-cli

# Skills derived from agent templates (no dedicated prompt files exist for these)
skills:
  # STRIDE threat modeling session – analyzes data flows, trust boundaries, mitigations
  - name: threat-model
    source: agents/threat-model-cli.agent.md
  # RWEST SSDLC compliance review – OWASP best practices, Critical/High/Medium/Low severity
  - name: ssdlc-review
    source: agents/rwest-ssdlc-reviewer.agent.md
  # Disaster Recovery documentation and Terraform DR infrastructure
  - name: recovery-plan
    source: agents/recovery-cli.agent.md

instructions:
  - source: security
