name: terraform-development
description: >-
  Terraform infrastructure-as-code development plugin.
  Covers module design, naming conventions, state management, security best
  practices, code review, and multi-cloud provider configurations.
version: "1.0.22"
author:
  name: Gravion
license: MIT
keywords:
  - terraform
  - iac
  - infrastructure
  - aws
  - azure
  - gcp

# Agents copied as-is from templates/agents/
agents:
  - source: terraform/terraform-expert
  - source: terraform/terraform-reviewer

# Skills generated from prompt templates
skills:
  # Terraform configuration review (security, naming, modules, state)
  - name: terraform-code-review
    source: terraform/terraform-code-review
  # Scaffold a reusable Terraform module with examples and README
  - name: terraform-module-create
    source: terraform/terraform-module-create
  # Diagnose unexpected plan changes (drift, lifecycle, provider mismatches)
  - name: terraform-plan-debugger
    source: terraform/terraform-plan-debugger
  # Detect and remediate infrastructure drift
  - name: terraform-drift-detection
    source: terraform/terraform-drift-detection

instructions:
  - source: terraform/terraform
