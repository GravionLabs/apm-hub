name: devops
description: >-
  Cross-cutting DevOps tooling.
  Publish code reviews as PR comments to GitHub or Azure DevOps,
  configure the az CLI azure-devops extension for pipeline integration,
  and create GitHub Actions CI/CD workflows using GravionLabs/ci reusable workflows.
version: "1.0.1"
author:
  name: Gravion
license: MIT
keywords:
  - devops
  - azure-devops
  - code-review
  - pull-request
  - github-actions
  - ci-cd

# Agents copied as-is from templates/agents/
agents:
  - source: code-review-publisher
  - source: az-devops-setup
  - source: create-pr

# Skills generated from agent templates (no dedicated prompts exist)
skills:
  # Publishes code review results as PR comments on GitHub or Azure DevOps
  - name: code-review-publisher
    source: agents/code-review-publisher
  # Interactive setup guide for az devops CLI and authentication
  - name: az-devops-setup
    source: agents/az-devops-setup
  # Analyzes git history and diff, generates structured PR description, creates PR
  - name: create-pr
    source: agents/create-pr
  # Create a GitHub Actions workflow calling GravionLabs/ci NuGet Package CI/CD
  - name: create-nuget-workflow
  # Create a GitHub Actions workflow calling GravionLabs/ci Python Package CI/CD
  - name: create-python-workflow
  # Create a GitHub Actions workflow calling GravionLabs/ci Node.js CI
  - name: create-node-workflow
  # Add GitVersion.yml configuration for automatic semantic versioning
  - name: add-gitversion
  # Create a GitHub Actions workflow that syncs docs/**/*.md and README.md to the GitHub Wiki
  - name: create-wiki-workflow

instructions:
  - source: shell
  - source: powershell
  - source: docker
  - source: terraform
