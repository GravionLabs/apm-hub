name: csharp-development
description: >-
  C#/.NET full-stack development plugin.
  Covers project setup, NUnit testing, async/await, code review, XML documentation,
  design patterns, EF Core, ASP.NET APIs, OpenAPI, MCP servers, .NET upgrades,
  modernization, Playwright .NET testing, and containerization.
version: "1.0.24"
author:
  name: Gravion
license: MIT
keywords:
  - csharp
  - dotnet
  - nunit
  - aspnet
  - efcore

# Agents copied as-is from templates/agents/
agents:
  - source: csharp/api-architect
  - source: csharp/csharp-expert
  - source: shared/documentation-writer
  - source: csharp/dotnet-upgrade.agent.md
  - source: csharp/expert-dotnet-software-engineer
  - source: csharp/migration-agent
  - source: csharp/modernization
  - source: csharp/nunit-engineer
  - source: csharp/openapi-to-application

# Skills generated from local prompt/agent templates (local rules take priority over awesome-copilot)
skills:
  - name: aspnet-minimal-api-openapi
    source: csharp/aspnet-minimal-api-openapi
  # Scaffold a new .NET solution with src/test layout and all build config files
  - name: create-dotnet-solution
    source: csharp/create-dotnet-solution
  - name: csharp-async
    source: csharp/csharp-async
  # Ensure C# types are documented with XML comments
  - name: csharp-docs
    source: csharp/csharp-docs
  - name: csharp-mcp-server-generator
    source: csharp/csharp-mcp-server-generator
  - name: csharp-nunit
    source: csharp/csharp-nunit
  - name: write-tests
    source: shared/write-tests
  # C# code review skill
  - name: csharp-code-review
    source: csharp/csharp-code-review
  - name: dotnet-best-practices
    source: csharp/dotnet-best-practices
  # Review C#/.NET code for design pattern implementation
  - name: dotnet-design-pattern-review
    source: csharp/dotnet-design-pattern-review
  # .NET framework upgrade analysis and execution
  - name: dotnet-upgrade
    source: csharp/dotnet-upgrade
  # Entity Framework Core best practices
  - name: ef-core
    source: csharp/ef-core

instructions:
  - source: csharp/csharp
  - source: csharp/csharp-nunit.instructions.md
  - source: csharp/playwright-dotnet

files:
  - source: editor-configs/.editorconfig-csharp
    destination: .editorconfig
