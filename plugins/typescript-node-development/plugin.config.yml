name: typescript-node-development
description: >-
  TypeScript and Node.js development plugin.
  Covers strict typing, ESM modules, async/await patterns, error handling,
  code review, Playwright TypeScript testing, and containerization.
version: "1.0.27"
author:
  name: Gravion
license: MIT
keywords:
  - typescript
  - nodejs
  - playwright
  - vitest
  - eslint

# Agents copied as-is from templates/agents/
agents:
  - source: typescript/typescript-expert
  - source: shared/documentation-writer
  - source: shared/test-engineer

# Skills generated from prompt templates
skills:
  # GitHub Actions CI/CD workflow for Node.js packages
  - name: create-node-workflow
    source: devops/create-node-workflow
  # TypeScript code review (type safety, strict mode, Node.js conventions)
  - name: typescript-code-review
    source: typescript/typescript-code-review
  # ESLint + Prettier + Husky setup for TypeScript projects
  - name: setup-prettier-eslint-husky
    source: typescript/setup-prettier-eslint-husky
  # Generate focused unit tests for existing code
  - name: write-tests
    source: shared/write-tests

instructions:
  - source: typescript/typescript
  - source: typescript/nodejs
  - source: typescript/playwright-typescript
