name: typescript-node-development
description: >-
  TypeScript and Node.js development plugin.
  Covers strict typing, ESM modules, async/await patterns, error handling,
  code review, debugging, Playwright TypeScript testing, and containerization.
version: "1.0.36"
author:
  name: Gravion
license: MIT
keywords:
  - typescript
  - nodejs
  - playwright
  - vitest
  - eslint

agents:
  - source: typescript/agents/typescript-expert
  - source: typescript/agents/typescript-reviewer
  - source: shared/agents/documentation-writer
  - source: shared/agents/test-engineer

skills:
  # Scaffold a new TypeScript/Node.js project (app, library, or CLI)
  - name: create-node-project
    source: typescript/skills/create-node-project
  # GitHub Actions CI/CD workflow for Node.js packages
  - name: create-node-workflow
    source: devops/skills/create-node-workflow
  # TypeScript code review (type safety, strict mode, Node.js conventions)
  - name: typescript-code-review
    source: typescript/skills/typescript-code-review
  # Diagnose and fix TypeScript type errors, module resolution, build failures
  - name: typescript-debug
    source: typescript/skills/typescript-debug
  # ESLint + Prettier + Husky setup for TypeScript projects
  - name: setup-prettier-eslint-husky
    source: typescript/skills/setup-prettier-eslint-husky
  # Generate a TypeScript MCP server with tools, resources, and prompts
  - name: typescript-mcp-server-generator
    source: typescript/skills/typescript-mcp-server-generator
  # Generate focused unit tests for existing code
  - name: write-tests
    source: shared/skills/write-tests

instructions:
  - source: typescript/instructions/typescript
  - source: typescript/instructions/nodejs
  - source: typescript/instructions/playwright-typescript
