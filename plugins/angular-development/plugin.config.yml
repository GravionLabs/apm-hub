name: angular-development
description: >-
  Angular 21 full-stack development plugin.
  Covers standalone components, NgRx Signal Store, Angular libraries,
  PrimeNG, ESLint/Prettier setup, sakai-ui conventions, and testing with Vitest.
version: "1.0.18"
author:
  name: Gravion
license: MIT
keywords:
  - angular
  - ngrx
  - signals
  - primeng
  - sakai-ui
  - typescript

# Agents copied as-is from templates/agents/
agents:
  - source: angular/angular-expert
  - source: angular/angular-library-architect
  - source: angular/sakai-ui-expert

# Skills generated from prompt templates
skills:
  # Code quality & tooling
  - name: setup-prettier-eslint-husky
    source: typescript/setup-prettier-eslint-husky

  # Component scaffolding
  - name: angular-component
    source: angular/angular-component
  - name: sakai-ui-component
    source: angular/sakai-ui-component

  # State management
  - name: angular-signal-store
    source: angular/angular-signal-store

  # Library setup
  - name: angular-library-create
    source: angular/angular-library-create

instructions:
  - source: angular/angular
  - source: angular/ngrx-signals
  - source: angular/sakai-ui
