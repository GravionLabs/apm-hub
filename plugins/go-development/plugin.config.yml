name: go-development
description: >-
  Go development plugin for idiomatic Go applications.
  Covers module structure, error handling, interface design, concurrency patterns,
  table-driven testing, code review, and containerization.
version: "1.0.30"
author:
  name: Gravion
license: MIT
keywords:
  - go
  - golang
  - modules
  - concurrency
  - testing

# Agents copied as-is from templates/agents/
agents:
  - source: go/agents/go-expert
  - source: shared/agents/documentation-writer

# Skills generated from prompt templates
skills:
  # Go code review (error handling, interfaces, concurrency, security)
  - name: go-code-review
    source: go/skills/go-code-review
  # Generate table-driven Go tests with subtests and mocks
  - name: go-test-generate
    source: go/skills/go-test-generate
  # Generate focused unit tests for existing code
  - name: write-tests
    source: shared/skills/write-tests

instructions:
  - source: go/instructions/go
