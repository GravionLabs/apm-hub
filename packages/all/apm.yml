name: all
version: 1.0.14
description: >
  Meta-package that installs all GravionLabs apm-hub packages in one step.
  Use this if you want every language plugin and shared tooling available in your workspace.
author:
  name: Gravion
license: MIT

dependencies:
  apm:
    - GravionLabs/apm-hub/packages/ng
    - GravionLabs/apm-hub/packages/development-workflow
    - GravionLabs/apm-hub/packages/dotnet
    - GravionLabs/apm-hub/packages/github
    - GravionLabs/apm-hub/packages/py
    - GravionLabs/apm-hub/packages/shared
    - GravionLabs/apm-hub/packages/ts
    - GravionLabs/apm-hub/packages/apm-install
