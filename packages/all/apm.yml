name: all
version: 1.0.1
description: >
  Meta-package that installs all GravionLabs apm-hub packages in one step.
  Use this if you want every language plugin and shared tooling available in your workspace.
author:
  name: Gravion
license: MIT

dependencies:
  apm:
    - GravionLabs/apm-hub/packages/angular
    - GravionLabs/apm-hub/packages/apm-workspace
    - GravionLabs/apm-hub/packages/common
    - GravionLabs/apm-hub/packages/development-workflow
    - GravionLabs/apm-hub/packages/devops
    - GravionLabs/apm-hub/packages/docker
    - GravionLabs/apm-hub/packages/dotnet
    - GravionLabs/apm-hub/packages/github
    - GravionLabs/apm-hub/packages/go
    - GravionLabs/apm-hub/packages/helm
    - GravionLabs/apm-hub/packages/playwright
    - GravionLabs/apm-hub/packages/postgresql
    - GravionLabs/apm-hub/packages/python
    - GravionLabs/apm-hub/packages/security
    - GravionLabs/apm-hub/packages/shared
    - GravionLabs/apm-hub/packages/terraform
    - GravionLabs/apm-hub/packages/typescript
