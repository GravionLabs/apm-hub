name: all
version: 3.1.0
description: >
  Meta-package that installs every apm-hub package except apm-tooling in one step.
  Use it in workspaces that mix several tech stacks.
author:
  name: Gravion
license: MIT

dependencies:
  apm:
    - GravionLabs/apm-hub/packages/statusline
    - GravionLabs/apm-hub/packages/ng
    - GravionLabs/apm-hub/packages/delivery
    - GravionLabs/apm-hub/packages/dotnet
    - GravionLabs/apm-hub/packages/github
    - GravionLabs/apm-hub/packages/py
    - GravionLabs/apm-hub/packages/rust
    - GravionLabs/apm-hub/packages/shared
    - GravionLabs/apm-hub/packages/ts
