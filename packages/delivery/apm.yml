name: delivery
version: 3.2.1
description: "Issue-driven development workflow: one-command delivery with subagents on any harness (deliver), open-decision interview (grill-me), run retrospective (retro), package installer (apm-install), and issue planning with native sub-issues. Pulls in github and shared; stack packages are installed per project."
dependencies:
  apm:
    - GravionLabs/apm-hub/packages/github
    - GravionLabs/apm-hub/packages/shared
x-skills:
  - apm-install
  - deliver
  - grill-me
  - planner
  - retro
