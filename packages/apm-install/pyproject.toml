[project]
name = "apm-install"
version = "1.2.0"
description = "Cross-platform apm install wrapper — sanitizes agent frontmatter per target"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
apm-install = "apm_install:main_install"
apm-update  = "apm_install:main_update"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
