name: development-workflow
version: 1.0.21
description: "Issue-driven development workflow: orchestrated plan → TDD → review → commit pipeline (/orch), parallel review fan-out, project verification, issue planning with native sub-issues, and git-cliff changelog setup. Pulls in github, shared and all language packages."
registry: https://github.com/GravionLabs/apm-hub
dependencies:
  apm:
    - GravionLabs/apm-hub/packages/github
    - GravionLabs/apm-hub/packages/shared
    - GravionLabs/apm-hub/packages/ts
    - GravionLabs/apm-hub/packages/py
    - GravionLabs/apm-hub/packages/ng
    - GravionLabs/apm-hub/packages/dotnet
skills:
  - cliff-setup
  - issue-planning
  - orch-pipeline
  - review-fanout
  - verify-project
